<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Click Fast! - Prototype</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Poppins:wght@400;600&display=swap"
        rel="stylesheet">

    <style>
        :root {
            --bg-color: #0b0f19;
            --text-color: #e2e8f0;
            --primary-color: #0ea5e9;
            --primary-glow: 0 0 15px rgba(14, 165, 233, 0.5);
            --danger-color: #f43f5e;
            --danger-glow: 0 0 20px rgba(244, 63, 94, 0.6);
            --grid-color: rgba(14, 165, 233, 0.15);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 3rem;
            color: #fff;
            text-shadow: var(--primary-glow);
            margin-bottom: 2rem;
            letter-spacing: 2px;
        }

        section {
            background: rgba(255, 255, 255, 0.03);
            padding: 40px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            width: 100%;
            max-width: 600px;
        }

        input,
        select {
            width: 100%;
            padding: 15px;
            margin-bottom: 20px;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--primary-color);
            border-radius: 8px;
            color: #fff;
            font-size: 1.1rem;
            outline: none;
            transition: all 0.3s ease;
        }

        input:focus,
        select:focus {
            box-shadow: var(--primary-glow);
        }

        button {
            background: var(--primary-color);
            color: #fff;
            border: none;
            padding: 15px 30px;
            font-size: 1.2rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.2s ease;
            width: 100%;
            font-family: 'Orbitron', sans-serif;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: var(--primary-glow);
            background: #0284c7;
        }

        #view-game {
            background: transparent;
            border: none;
            box-shadow: none;
            padding: 0;
            max-width: auto;
        }

        #countdown {
            font-size: 2rem;
            margin-bottom: 15px;
            color: var(--primary-color);
        }

        #arena {
            background-color: #0f172a;
            /* Fond de l'arène */
            background-image:
                linear-gradient(var(--grid-color) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
            background-size: 50px 50px;
            /* Taille des cases du quadrillage */

            border: 2px solid var(--primary-color);
            border-radius: 12px;
            box-shadow: var(--primary-glow);
            overflow: hidden;
            margin: 0 auto;
            cursor: crosshair;
            /* Curseur de visée */
        }

        #target {
            background: radial-gradient(circle, #fb7185 10%, var(--danger-color) 80%);
            border: 2px solid #fff;
            border-radius: 50%;
            /* Cible ronde */
            box-shadow: var(--danger-glow);
            transition: transform 0.05s;
        }

        #target:active {
            transform: scale(0.8);
        }
    </style>
</head>

<body>

    <section id="view-home">
        <h1>CLICK FAST!</h1>
        <p style="margin-bottom: 30px; color: #94a3b8;">Testez vos réflexes et votre précision.</p>
        <button type="button" id="btn-go-config">Jouer</button>
        <button type="button" id="btn-go-history"
            style="background: transparent; border: 1px solid var(--primary-color); margin-top: 15px;">Voir
            l'Historique</button>
    </section>

    <section id="view-config" style="display: none;">
        <h1>Configuration</h1>
        <input type="text" id="pseudo" minlength="2" maxlength="20" placeholder="Entrez votre pseudo" required>

        <select id="select-time">
            <option value="10">10 secondes</option>
            <option value="20">20 secondes</option>
            <option value="30">30 secondes</option>
        </select>

        <select id="select-mode">
            <option value="classique" selected>Mode Classique</option>
            <option value="precision">Mode Précision</option>
        </select>

        <select id="select-difficulty">
            <option value="facile">Facile (Cible 80px)</option>
            <option value="moyenne" selected>Moyenne (Cible 60px)</option>
            <option value="difficile">Difficile (Cible 40px)</option>
        </select>

        <button type="button" id="btn-start-game">Lancer la partie</button>
    </section>

    <section id="view-game" style="display: none;">
        <h1 id="countdown">Prêt ?</h1>

        <div id="arena" style="width: 500px; height: 500px; position: relative;">
            <div id="target" style="position: absolute; width: 60px; height: 60px; top: 220px; left: 220px;"></div>
        </div>
    </section>

    <section id="view-results" style="display: none;">
        <h1>Temps écoulé !</h1>
        <p id="score" style="font-size: 2rem; font-weight: bold; color: var(--primary-color); margin: 20px 0;"></p>
        <button type="button" id="btn-replay" style="margin-top: 20px;">Rejouer</button>
    </section>

    <section id="view-history" style="display: none;">
        <h2>Dernières Sessions</h2>

        <div id="history-container"
            style="margin: 20px 0; max-height: 300px; overflow-y: auto; text-align: left; background: rgba(0,0,0,0.3); border-radius: 8px; padding: 10px;">
        </div>

        <div style="display: flex; gap: 10px;">
            <button type="button" id="btn-back-home" style="background: #64748b;">Retour</button>
            <button type="button" id="btn-purge-history" style="background: var(--danger-color);">Purger</button>
        </div>
    </section>
    <script src="main.js"></script>
</body>

</html>
